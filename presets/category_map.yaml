# ──────────────────────────────────────────────────────────────────────
# Product-type detection rules (applied in plan_recat.py in order —
# first match wins). Kept here so adjustments don't require code edits.
# ──────────────────────────────────────────────────────────────────────
product_patterns:
  - Shirt:     "\\b(shirt|jersey|kit|strip)\\b"
  - DVD:       "\\bdvd\\b"
  - Book:      "\\b(book|autobiography|hardback|paperback)\\b"
  - Programme: "\\b(programme|program)\\b"
  - Glove:     "\\bglove"
  - Ball:      "\\b(match\\s*ball|signed\\s*ball|mini\\s*ball)\\b"
  - Boot:      "\\bboot"
  - Record:    "\\b(vinyl|record|lp|album)\\b"
  - Poster:    "\\bposter\\b"
  - Script:    "\\bscript\\b"
  - Flag:      "\\bflag\\b"
  - Cap:       "\\bcap\\b"
  - Postcard:  "\\b(postcard|post\\s*card)\\b"
  - Card:      "\\b(white\\s*card|index\\s*card|5x3|\\bcard\\b)"
  - Photo:     ".*"   # default fallback
