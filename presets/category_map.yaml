# ============================================================================
# Canonical (signer_genre × product_type) → eBay category_id map.
#
# Used by scripts/plan_recat.py to decide where each listing SHOULD live,
# based on:
#   * signer_genre  — a per-signer classification (see signer_genre.yaml)
#   * product_type  — auto-detected from title keywords (see
#                     scripts/plan_recat.py PRODUCT_PATTERNS)
#
# Each entry: target category_id + the canonical category_name so the
# recat preview can show the destination alongside the move count.
#
# "??" values mean we haven't confirmed that cat yet — leave the listing
# alone until Peter confirms. The recat planner surfaces unknowns in a
# "needs_mapping" bucket rather than guessing.
#
# Last updated: 2026-04-19 — initial draft, iterating as the category
# refresh (scripts/refresh_categories.py) surfaces more cats in the cache.
# ============================================================================

genres:
  football_retired:     "Players whose career ended pre-Premier-League era (BR, TS, Jennings, Keegan)"
  football_premiership: "Current / recent Premier League players"
  football_international: "Pure national-team signatures (no club)"
  tv_male:              "Male TV personality (Clarkson, Martin Clunes)"
  tv_female:            "Female TV personality (Joanna Lumley, Erin Gray)"
  film_male:            "Male film actor (Dan Aykroyd, Tim Allen, Jackie Chan)"
  film_female:          "Female film actress"
  music:                "Musicians, band members"
  comedy:               "Stand-ups, comedians where not TV-specific"
  sport_cricket:
  sport_tennis:
  sport_golf:
  sport_boxing:
  sport_f1:             "(Mario Andretti belongs here)"
  sport_basketball:     "(Shaquille O'Neal)"
  sport_cycling:        "(Bernard Hinault, Eddy Merckx)"
  sport_rugby_league:   "(Kevin Sinfield)"
  sport_rugby_union:
  other:

