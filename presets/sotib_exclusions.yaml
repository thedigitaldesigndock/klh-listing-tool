# SOTIB signer exclusions — MANUAL OVERRIDE FALLBACK (rarely needed)
#
# Primary exclusion mechanism is now auto-derived: send_tier_offers reads
# the titles of every listing currently in a RUNNING markdown sale and
# auto-excludes any eligible listing whose title contains one of those
# signer names. The exclusion auto-clears the moment the markdown ends —
# no human in the loop.
#
# This file is now only for the escape-hatch case: a sale Kim runs
# WITHOUT using eBay's markdown promo tool (e.g. hand-edited prices on
# a batch of listings, or a coupon-code sale that doesn't appear in the
# markdown API). In that case, add an entry like:
#
#   excluded_signers:
#     - name: "joanna lumley"
#       until: 2026-05-25      # ← REQUIRED. Entries with no `until` are
#                                ignored and warned about.
#
# When `until` passes, the entry stops applying automatically. No more
# stale exclusions silently killing offers for weeks because someone
# forgot to clear the file (Attenborough sat here for 11 days post-sale
# and killed every single eligible offer in that window).

excluded_signers: []
